name: Condicionais e Docker
on:
  push:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar no Docker Hub (somente apos autorizacao)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '18'
      - run: npm ci
      - name: Lint
        id: lint-step
        run: npm run lint
      - name: check-lint
        if: ${{ failure() && steps.lint-step.outcome == 'failure' }}
        run: echo "Codigo precisa ser revisto!! Build bloqueado."
  build_docker:
    needs: lint
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build local no runner
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: webacademy-lab04:local
      - name: Validar credenciais de publicacao
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "Secret DOCKERHUB_USERNAME ausente"; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "Secret DOCKERHUB_TOKEN ausente"; exit 1; }
      - name: Login no Docker Hub
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publicar imagem
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/webacademy-lab04:${{ github.sha }}
